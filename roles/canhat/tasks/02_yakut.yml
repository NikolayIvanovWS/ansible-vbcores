---
- name: Fix dependency hell using aptitude
  become: true
  block:
    - name: Install aptitude
      ansible.builtin.apt:
        name: aptitude
        state: present
        update_cache: yes

    - name: Install common packages using aptitude
      # Aptitude сам предложит и применит решение по обновлению конфликтующих либ
      ansible.builtin.shell: |
        aptitude install -y \
          python3-jsonnet \
          python3-psutil \
          libsdl2-dev \
          libasound2-dev \
          libjack-dev \
          can-utils \
          jq \
          unzip
      register: aptitude_result
      changed_when: "'Installing' in aptitude_result.stdout"

- name: Ensure user application directory exists
  ansible.builtin.file:
    path: /home/pi/.local/bin
    state: directory
    mode: '0755'
  become: true
  become_user: pi

- name: Install latest stable CAN Python dependencies in user environment
  ansible.builtin.pip:
    name:
      - numpy
      - scipy
      - yakut
      - "pycyphal[dsdl]"
      - "nunavut[py]"
      - "pydsdl"
    state: latest
    executable: pip3
    extra_args: "--user --break-system-packages --upgrade-strategy eager"
  become: true
  become_user: pi

- name: Update .bashrc for /home/pi/.local/bin path
  lineinfile:
     dest: /home/pi/.bashrc
     line: export PATH=$PATH:/home/pi/.local/bin

- name: Copy .yakut_params
  ansible.builtin.copy:
    src: .yakut_params
    dest: /home/pi/.yakut_params
    mode: 0644
    owner: pi
    group: pi    
  become: true

- name: Update .bashrc for .yakut
  lineinfile:
     dest: /home/pi/.bashrc
     line: source /home/pi/.yakut_params


- name: Create .pycyphal dir
  file:
    path: /home/pi/.pycyphal
    state: directory
    mode: 0755  
  become: true
  become_user: pi

- name: Download OpenCyphal regulated data types
  ansible.builtin.unarchive:
    src: https://github.com/OpenCyphal/public_regulated_data_types/archive/refs/heads/master.zip
    dest: /home/pi/.pycyphal
    remote_src: yes
    creates: /home/pi/.pycyphal/public_regulated_data_types-master/uavcan
  become: true
  become_user: pi

- name: Download Voltbro custom data types
  ansible.builtin.unarchive:
    src: https://github.com/voltbro/cyphal-types/archive/refs/heads/master.zip
    dest: /home/pi/.pycyphal
    remote_src: yes
    creates: /home/pi/.pycyphal/cyphal-types-master/voltbro
  become: true
  become_user: pi

- name: Remove redundant data types from Voltbro folder
  ansible.builtin.file:
    path: /home/pi/.pycyphal/cyphal-types-master/public_regulated_data_types
    state: absent
  become: true
  become_user: pi

- name: Generate Cyphal Python types (Standard + Voltbro)
  ansible.builtin.shell:
    chdir: /home/pi/.pycyphal
    cmd: |
      # 1. Компилируем базовые типы uavcan
      /usr/bin/python3 -m nunavut \
        --target-language py \
        --outdir . \
        public_regulated_data_types-master/uavcan

      # 2. Компилируем типы reg (зависят от uavcan)
      /usr/bin/python3 -m nunavut \
        --target-language py \
        --outdir . \
        --lookup-dir public_regulated_data_types-master/uavcan \
        public_regulated_data_types-master/reg

      # 3. Компилируем кастомные типы voltbro (зависят от uavcan и reg)
      /usr/bin/python3 -m nunavut \
        --target-language py \
        --outdir . \
        --lookup-dir public_regulated_data_types-master/uavcan \
        --lookup-dir public_regulated_data_types-master/reg \
        cyphal-types-master/voltbro/
    # Проверка по итоговому файлу из папки voltbro
    creates: /home/pi/.pycyphal/voltbro/config/Endpoint_1_0.py
  become: true
  become_user: pi

- name: Add .pycyphal to PYTHONPATH in .bashrc
  lineinfile:
    dest: /home/pi/.bashrc
    regexp: '^export PYTHONPATH=.*\.pycyphal.*$'
    line: 'export PYTHONPATH="$PYTHONPATH:/home/pi/.pycyphal"'
    state: present

- name: Verify user environment dependencies
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -m
      - pip
      - check
  changed_when: false
  become: true
  become_user: pi

- name: Verify Yakut scientific stack
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import numpy, scipy, pycyphal;
        from scipy.sparse import dok_matrix;
        print(f"NumPy {numpy.__version__}, SciPy {scipy.__version__}, PyCyphal {pycyphal.__version__}")
  register: canhat_yakut_stack_check
  changed_when: false
  become: true
  become_user: pi

- name: Show Yakut scientific stack versions
  ansible.builtin.debug:
    msg: "{{ canhat_yakut_stack_check.stdout }}"
