---
- name: Clear colcon log dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items: "{{ clear_colcon_dirs }}"

- name: Create colcon empty log dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0775
  with_items: "{{ clear_colcon_dirs }}"
  become: true
  become_user: pi

- name: Create COLCON_IGNORE files
  ansible.builtin.file:
    path: "{{ item }}/COLCON_IGNORE"
    state: touch
    mode: 0664
  with_items: "{{ clear_colcon_dirs }}"
  become: true
  become_user: pi

- name: Clear other dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  with_items: "{{ clear_dirs }}"

- name: Restore firstboot script for final image
  ansible.builtin.copy:
    src: scripts/firstboot.sh
    dest: /boot/firmware/firstboot.sh
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Remove old firstboot done marker
  ansible.builtin.file:
    path: /boot/firmware/firstboot.sh.done
    state: absent
  become: true

- name: Install firstboot service for final image
  ansible.builtin.copy:
    src: systemd/firstboot.service
    dest: /lib/systemd/system/firstboot.service
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Enable firstboot service for next boot
  ansible.builtin.systemd:
    name: firstboot
    enabled: true
    daemon_reload: true
  become: true

# --- Новые задачи для чистоты образа ---

- name: Remove shell history files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/pi/.bash_history
    - /home/pi/.zsh_history
    - /home/pi/.python_history
    - /root/.bash_history
    - /root/.zsh_history
    - /root/.python_history
    - /home/pi/.sudo_as_admin_successful
  become: true

- name: Remove user caches
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/pi/.cache
    - /home/pi/.copilot
    - /home/pi/.ansible_async
    - /root/.cache
    - /home/pi/.local/share/pip
    - /root/.local/share/pip
    - /root/.ros
  become: true

- name: Clean temporary directories
  ansible.builtin.shell: |
    find /tmp /var/tmp -xdev -mindepth 1 -maxdepth 1 \
      ! -name 'ansible_*' \
      ! -name 'ansible-*' \
      ! -name 'systemd-private-*' \
      -exec rm -rf -- {} + || true
  args:
    executable: /bin/bash
  changed_when: false
  become: true

- name: Remove rotated log files
  ansible.builtin.shell: |
    find /var/log -xdev -type f \( -name '*.gz' -o -name '*.old' -o -regex '.*\.[0-9]+' \) -delete
  args:
    executable: /bin/bash
  changed_when: false
  become: true

- name: Truncate remaining log files
  ansible.builtin.shell: |
    find /var/log -xdev -type f -exec truncate -s 0 {} +
  args:
    executable: /bin/bash
  changed_when: false
  become: true

- name: Reset machine-id
  ansible.builtin.shell: |
    echo "" > /etc/machine-id
    rm -f /var/lib/dbus/machine-id
  become: true

- name: Clean apt cache
  ansible.builtin.apt:
    clean: yes
  become: true

- name: Purge remaining old kernels and dependencies
  ansible.builtin.apt:
    autoremove: yes
    purge: yes
  become: true

- name: Shrink systemd journal to 1M
  ansible.builtin.shell: journalctl --vacuum-size=1M --rotate
  become: true
  changed_when: false

# --- Завершающие задачи ---

- name: Finalize SSH cleanup and schedule reboot
  ansible.builtin.shell: |
    rm -f \
      /home/pi/.ssh/known_hosts \
      /home/pi/.ssh/known_hosts.old \
      /home/pi/.ssh/authorized_keys \
      /home/pi/.ssh/id_rsa \
      /home/pi/.ssh/id_rsa.pub \
      /home/pi/.ssh/id_ed25519 \
      /home/pi/.ssh/id_ed25519.pub \
      /home/pi/.ssh/id_ecdsa \
      /home/pi/.ssh/id_ecdsa.pub \
      /root/.ssh/known_hosts \
      /root/.ssh/known_hosts.old \
      /root/.ssh/authorized_keys \
      /root/.ssh/id_rsa \
      /root/.ssh/id_rsa.pub \
      /root/.ssh/id_ed25519 \
      /root/.ssh/id_ed25519.pub \
      /root/.ssh/id_ecdsa \
      /root/.ssh/id_ecdsa.pub
    ssh-keygen -A
    systemctl enable ssh
    sync
    nohup sh -c 'sleep 2; systemctl reboot' >/dev/null 2>&1 &
  args:
    executable: /bin/bash
  become: true
  changed_when: true
