---
- name: Install rosbridge as a development tool without an autostart service
  ansible.builtin.apt:
    name: "ros-{{ rosname }}-rosbridge-server"
    state: present
    update_cache: true
  become: true

- name: Mark the universal onboard image
  ansible.builtin.lineinfile:
    path: /etc/os-release
    regexp: '^IMAGE_VERSION='
    line: 'IMAGE_VERSION="{{ image_version }}"'
  become: true

- name: Create user configuration directory
  ansible.builtin.file:
    path: /home/pi/ros2_ws/config
    state: directory
    owner: pi
    group: pi
    mode: '0755'
  become: true

- name: Install neutral CAN0 bridge configuration without automatic startup
  ansible.builtin.copy:
    src: can0.json
    dest: /home/pi/ros2_ws/config/can0.json
    owner: pi
    group: pi
    mode: '0644'
  become: true

- name: Install onboard usage notes
  ansible.builtin.copy:
    src: ONBOARD.md
    dest: /home/pi/ONBOARD.md
    owner: pi
    group: pi
    mode: '0644'
  become: true
