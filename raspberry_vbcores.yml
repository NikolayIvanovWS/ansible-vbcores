---
- name: Prepare universal VBCores onboard computer
  hosts: vbcores
  become: true
  vars:
    common_hostname: vbcores01
    image_version: vbcoresOS_v1.0
    ros2_extra_packages: []
    network_wifi_fallback_ssid: "{{ common_hostname }}"
    network_wifi_fallback_dependent_services: fastdds
  roles:
    - role: common
      tags: [common]
    - role: ros2
      tags: [ros2]
    - role: can-yakut
      tags: [can-yakut]
    - role: network-fallback
      tags: [network-fallback]
    - role: network-wifi-fallback
      tags: [network-wifi-fallback]
  tasks:
    - name: Mark the universal onboard image
      ansible.builtin.lineinfile:
        path: /etc/os-release
        regexp: '^IMAGE_VERSION='
        line: 'IMAGE_VERSION="{{ image_version }}"'
      tags: [image_version]
