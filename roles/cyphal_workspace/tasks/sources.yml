---
- name: Create ROS workspace source directory
  ansible.builtin.file:
    path: /home/pi/ros2_ws/src
    state: directory
    owner: pi
    group: pi
    mode: '0755'
  become: true

- name: Clone cyphal_ros2_bridge (without submodules initially)
  ansible.builtin.git:
    repo: https://github.com/VBCores/cyphal_ros2_bridge.git
    dest: /home/pi/ros2_ws/src/cyphal_ros2_bridge
    recursive: false
    version: "{{ cyphal_bridge_version }}"
  become: true
  become_user: pi

- name: Use HTTPS for GitHub submodules
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - url.https://github.com/.insteadOf
      - 'git@github.com:'
  become: true
  become_user: pi
  changed_when: false

- name: Update submodules recursively
  ansible.builtin.command:
    chdir: /home/pi/ros2_ws/src/cyphal_ros2_bridge
    cmd: git submodule update --init --recursive
  become: true
  become_user: pi

