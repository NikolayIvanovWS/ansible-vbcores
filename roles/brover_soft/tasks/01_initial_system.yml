---
- name: Install ROS and system dependencies for brover_soft
  become: true
  ansible.builtin.apt:
    name:
      - ros-jazzy-joy
      - python3-pydantic
      - libhidapi-dev
      - libboost-all-dev
      - ros-jazzy-tf-transformations
      - ros-jazzy-usb-cam
      - ros-jazzy-rosbridge-server
      - python3-flask
      - ros-jazzy-web-video-server
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install latest transforms3d for NumPy compatibility
  ansible.builtin.pip:
    name: transforms3d
    state: latest
    executable: pip3
    extra_args: "--user --break-system-packages"
  become: true
  become_user: pi

- name: Install latest headless OpenCV for Python image processing
  ansible.builtin.pip:
    name: opencv-python-headless
    state: latest
    executable: pip3
    extra_args: "--user --break-system-packages --only-binary=:all:"
  become: true
  become_user: pi

- name: Set rover hostname
  ansible.builtin.hostname:
    name: "{{ common_hostname }}"
    use: systemd
  become: true

- name: Update /etc/hosts with new hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s+.*'
    line: '127.0.1.1 {{ common_hostname }}'
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Add IMAGE_VERSION to /etc/os-release
  ansible.builtin.lineinfile:
    path: /etc/os-release
    regexp: '^IMAGE_VERSION='
    line: 'IMAGE_VERSION="{{ image_version }}"'
    state: present
  become: true

- name: Replace /boot/firmware/config.txt
  ansible.builtin.copy:
    src: config.txt
    dest: /boot/firmware/config.txt
    owner: root
    group: root
    mode: '0755'
  become: true
